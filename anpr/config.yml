# Sentinel Gujarat ANPR worker - default configuration.
# Keys are the lowercase environment-variable names of CONTRACT.md section 1.3 (ANPR worker table).
# Precedence: CLI flags > environment > server settings (GET /internal/anpr-config) > this file > built-in defaults.
# The camera list itself always comes from the API (or from --source / ANPR_SOURCES for file tests).

anpr_mode: live               # live | preindex
cpu: true                     # 1/true: software decode + onnxruntime CPU provider (the GPU image sets CPU=0)
api_url: http://api:8000
# internal_api_key: sk_internal0000000000000000000000000000000000   # set INTERNAL_API_KEY in the environment instead
rtsp_base: rtsp://mediamtx:8554

# camera selection (applied after the config endpoint's list)
# anpr_cameras: [1, 2, 3]     # restrict this worker to these camera ids (Phase 2: split across hosts)
anpr_max_cameras: 0           # 0 = platform default: 3 with cpu=true, 12 with cpu=false

# decode
anpr_fps: 5                   # live mode target fps (select=not(mod(n,K)), K = round(source_fps / anpr_fps))
preindex_fps: 1               # informational in pre-index mode: every key frame is taken (-skip_frame nokey)
preindex_skip_live: true      # pre-index worker skips cameras already covered live (mode == both)
frame_width: 960              # scale=960:-2
reconnect_min_s: 2
reconnect_max_s: 30
# real relay / organiser feeds (anpr/decode.py): no ffprobe before an RTSP dial (stream info comes from
# ffmpeg's stderr), 30 s RTSP socket timeout, 90 s for the first frame, 60 s stall watchdog, one dial
# at a time 3 s apart, 2 decoder threads per ffmpeg
anpr_probe_timeout_s: 45
anpr_rtsp_probe: false
anpr_rtsp_timeout_s: 30
anpr_start_timeout_s: 90
anpr_stall_timeout_s: 60
anpr_dial_spacing_s: 3
anpr_decode_threads: 2
api_timeout_s: 30

# plate detection + OCR
anpr_detector: auto           # auto | onnx | contour
anpr_det_model: /app/weights/yolo-v9-t-384-license-plates-end2end.onnx
anpr_det_conf: 0.4
anpr_min_plate_w: 60
anpr_det_tile: 0              # >0: also run the detector on overlapping tiles of this size (px) - needed for
                              # wide-angle 1080p feeds where plates are 30-110 px (organiser sandbox); costs one
                              # inference per tile (1920 px frame, 768 px tiles -> 6 tiles + whole frame)
anpr_det_tile_overlap: 0.15
anpr_static_box_window: 20    # boxes present in >= anpr_static_box_hits of the last N frames are burnt-in text / signboards, not plates (0 = off)
anpr_static_box_hits: 0.8     # 0.5 on the organiser feeds (captions / signboards are boxed intermittently)
anpr_osd_band: 0.08           # boxes centred in the top/bottom 8 % of the frame (burnt-in clocks, captions) are never plates (0 = off)
anpr_osd_warmup_s: 30         # static-text regions (low temporal variance + strong edges) learnt from the first 30 s and refreshed every 30 s (0 = off)
anpr_invalid_reads_per_min: 10  # invalid-format reads posted per camera per minute at most (valid plates are never capped; 0 = unlimited)
anpr_ocr: paddle              # paddle | fast_plate | ensemble (anpr/ocr.py; measured on the organiser crop bank in docs/anpr-accuracy.md)
anpr_ocr_fast_model: global_mobile_vit_v2_ocr   # fast-plate-ocr model stem in /app/weights (or cct_s_v2_global)
anpr_ocr_paddle_mode: det     # det = det+rec on every crop (reads the organiser plates; rec-only on the padded crop misreads) | auto | rec
anpr_ocr_ensemble_min_conf: 0.45
anpr_ocr_min_w: 60            # OCR only crops at least this wide (decoded px); narrower boxes are still tracked as detected vehicles
anpr_detect_width: 0          # detector input width (0 = decoded width); e.g. frame_width 0 (native 1920) + detect_width 1280 = native crops, 3-tile detection
anpr_best_shot: true          # track plates across frames (anpr/tracks.py) and OCR the best crops of a track once it settles / ends
anpr_track_gap_s: 2
anpr_track_keep: 3
anpr_track_stall: 3
anpr_evidence_dir: ""         # e.g. /app/media/anpr_evidence - one crop + JSON line per detected vehicle (needs a writable mount)
anpr_evidence_per_hour: 200
anpr_vote_window_s: 3
anpr_min_read_conf: 0.30
sighting_close_s: 15
ocr_lang: en
ocr_threads: 2
anpr_max_boxes: 4             # OCR budget per frame (largest / most confident boxes first)

# snapshots and batching (live mode)
snapshot_interval_s: 1
snapshot_width: 480
post_batch_s: 1
config_reload_s: 60
heartbeat_s: 15

# object counting (live mode only; never in pre-index)
object_detect: true
object_model: /app/weights/yolox_s.onnx
object_conf: 0.35
object_every_n: 5

# testing knobs
api_dry_run: false            # true: print API payloads as JSON lines instead of POSTing
# anpr_sources: {1: /media/synthetic/cam_1.mp4}   # static sources (file or rtsp); skips the config endpoint
anpr_file_re: true            # file sources are paced in real time (-re)
anpr_file_loop: 0             # 0 = play once, -1 = loop forever
log_level: INFO
