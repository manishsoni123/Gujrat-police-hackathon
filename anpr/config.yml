# Sentinel Gujarat ANPR worker - default configuration.
# Keys are the lowercase environment-variable names of CONTRACT.md section 1.3 (ANPR worker table).
# Precedence: CLI flags > environment > server settings (GET /internal/anpr-config) > this file > built-in defaults.
# The camera list itself always comes from the API (or from --source / ANPR_SOURCES for file tests).

anpr_mode: live               # live | preindex
cpu: true                     # 1/true: software decode + onnxruntime CPU provider (the GPU image sets CPU=0)
api_url: http://api:8000
# internal_api_key: sk_internal0000000000000000000000000000000000   # set INTERNAL_API_KEY in the environment instead
rtsp_base: rtsp://mediamtx:8554

# camera selection (applied after the config endpoint's list)
# anpr_cameras: [1, 2, 3]     # restrict this worker to these camera ids (Phase 2: split across hosts)
anpr_max_cameras: 0           # 0 = platform default: 3 with cpu=true, 12 with cpu=false

# decode
anpr_fps: 5                   # live mode target fps (select=not(mod(n,K)), K = round(source_fps / anpr_fps))
preindex_fps: 1               # informational in pre-index mode: every key frame is taken (-skip_frame nokey)
preindex_skip_live: true      # pre-index worker skips cameras already covered live (mode == both)
frame_width: 960              # scale=960:-2
reconnect_min_s: 2
reconnect_max_s: 30

# plate detection + OCR
anpr_detector: auto           # auto | onnx | contour
anpr_det_model: /app/weights/yolo-v9-t-384-license-plates-end2end.onnx
anpr_det_conf: 0.4
anpr_min_plate_w: 60
anpr_vote_window_s: 3
anpr_min_read_conf: 0.30
sighting_close_s: 15
ocr_lang: en
ocr_threads: 2
anpr_max_boxes: 4             # OCR budget per frame (largest / most confident boxes first)

# snapshots and batching (live mode)
snapshot_interval_s: 1
snapshot_width: 480
post_batch_s: 1
config_reload_s: 60
heartbeat_s: 15

# object counting (live mode only; never in pre-index)
object_detect: true
object_model: /app/weights/yolox_s.onnx
object_conf: 0.35
object_every_n: 5

# testing knobs
api_dry_run: false            # true: print API payloads as JSON lines instead of POSTing
# anpr_sources: {1: /media/synthetic/cam_1.mp4}   # static sources (file or rtsp); skips the config endpoint
anpr_file_re: true            # file sources are paced in real time (-re)
anpr_file_loop: 0             # 0 = play once, -1 = loop forever
log_level: INFO
